name: Collect data (phases 1-2)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["src/**", "run_collectors.py", "requirements.txt", ".github/workflows/collect-data.yml"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run collectors
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_collectors.py 2>&1 | tee data/processed/last_run_log.txt
      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "data: refresh processed CSVs"
          git push
